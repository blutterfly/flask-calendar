<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calendar App</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Calendar</h1>
    <form method="POST">
        <label for="month">Month:</label>
        <input type="number" id="month" name="month" min="1" max="12" value="{{ month }}">
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" min="1900" max="2100" value="{{ year }}">
        <button type="submit">Show Calendar</button>
    </form>
    <br>
    {{ calendar_data | safe }}
</body>
</html>
